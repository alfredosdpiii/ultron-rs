[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables are enough for panics and backtraces; full debug info made each of the ~600 test binaries ~250 MB, which
# was most of a test build's link time and of the target directory.
[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev builds (serde_json, regex, tokio, rusqlite...): the tests run debug binaries that
# spend most of their time in them, at a fraction of the CPU unoptimized; the workspace's own crates stay quick to
# rebuild. The first build after a dependency change takes longer.
[profile.dev.package."*"]
opt-level = 2

# Cross-crate inlining and one codegen unit per crate: faster code for a slower release build.
[profile.release]
lto = "thin"
codegen-units = 1
