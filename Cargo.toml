[workspace]
resolver = "3"
members = ["crates/*", "packages/coding-agent"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/alfredosdpiii/ultron-rs"
version = "1.0.2"

[workspace.dependencies]
loki = { package = "loki-guardrails", version = "=0.2.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
allow_attributes_without_reason = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
needless_raw_string_hashes = "warn"
semicolon_if_nothing_returned = "warn"
cast_lossless = "warn"
duration_suboptimal_units = "warn"
bool_to_int_with_if = "warn"

# Line tables are enough for panics and backtraces; full debug info made each of the ~600 test binaries ~250 MB, which
# was most of a test build's link time and of the target directory.
[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev builds (serde_json, regex, tokio, rusqlite...): the tests run debug binaries that
# spend most of their time in them, at a fraction of the CPU unoptimized; the workspace's own crates stay quick to
# rebuild. The first build after a dependency change takes longer.
[profile.dev.package."*"]
opt-level = 2

# Cross-crate inlining and one codegen unit per crate: faster code for a slower release build.
[profile.release]
lto = "thin"
codegen-units = 1
