[package]
name = "judge"
version = "0.1.0"
description = "The judge seat: closed-set decisions asked of Jev (TypeSafe System One), a d1 server or a chat model, with fallback, escalation to another model family, review verdicts, spend receipts and limits; judge.decide and ultron judge bench"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
blocking-http = { path = "../blocking-http" }
config = { path = "../config" }
host = { path = "../host" }
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
