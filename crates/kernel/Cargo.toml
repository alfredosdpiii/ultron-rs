[package]
name = "ultron-kernel"
version.workspace = true
description = "Supervisor for Ultron's persistent Python kernel (runtime.py): process, wire protocol, host requests"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "kernel"

[dependencies]
command-fds = "=0.3.3"
getrandom = "=0.4.3"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
rustix = { version = "=1.1.5", features = ["process", "std"] }
sandbox = { package = "ultron-sandbox", path = "../sandbox", version = "=1.0.0" }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "sandboxed"
path = "tests/sandboxed.rs"
