[package]
name = "ultron-protocol"
version.workspace = true
description = "Ultron server/client wire protocol: strict CBOR, length-prefixed framing, validated messages"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "protocol"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
