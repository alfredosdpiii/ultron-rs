[package]
name = "ultron-hindsight"
version.workspace = true
description = "Ultron's Hindsight memory client: the native Hindsight 0.9.2 document endpoints behind memory.* and autoreview's lessons, the Hindsight URL and bank resolution, over the blocking-http transport"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hindsight"

[dependencies]
blocking-http = { package = "ultron-blocking-http", path = "../blocking-http", version = "=1.0.1" }
config = { package = "ultron-config", path = "../config", version = "=1.0.1" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.1" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
regex = "=1.13.1"

[lints]
workspace = true
