[package]
name = "hindsight"
version = "0.1.0"
description = "Ultron's Hindsight memory client: the native Hindsight 0.9.2 document endpoints behind memory.* and autoreview's lessons, the Hindsight URL and bank resolution, over the blocking-http transport"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blocking-http = { path = "../blocking-http" }
config = { path = "../config" }
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
regex = "=1.13.1"

[lints]
workspace = true
