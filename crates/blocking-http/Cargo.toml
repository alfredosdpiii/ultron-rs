[package]
name = "ultron-blocking-http"
version.workspace = true
description = "One blocking HTTP exchange for host-thread callers (Hindsight, the judge seat): a transport trait with a reqwest implementation on a private one-thread runtime, a size limit, a deadline and a cancelling signal"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "blocking_http"

[dependencies]
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
