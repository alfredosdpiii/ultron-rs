[package]
name = "blocking-http"
version = "0.1.0"
description = "One blocking HTTP exchange for host-thread callers (Hindsight, the judge seat): a transport trait with a reqwest implementation on a private one-thread runtime, a size limit, a deadline and a cancelling signal"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kernel = { path = "../kernel" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
