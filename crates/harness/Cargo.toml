[package]
name = "ultron-harness"
version.workspace = true
description = "Durable task runtime: the Pi Durable scheduler and conversation runtime (submissions, generation, durable REPL cells, children, swarm state), the RLM task journal, the lane snapshot reducer and the effect gate"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "harness"

[dependencies]
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.2" }
chord-delta = { package = "ultron-chord-delta", path = "../chord-delta", version = "=1.0.2" }
compaction = { package = "ultron-compaction", path = "../compaction", version = "=1.0.2" }
durable = { package = "ultron-durable", path = "../durable", version = "=1.0.2" }
indexmap = "=2.14.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.2" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { package = "ultron-session-journal", path = "../session-journal", version = "=1.0.2" }

[features]
# The scripted provider `chat::faux`, for this crate's and dependents' tests.
test-support = []

[dev-dependencies]
harness = { package = "ultron-harness", path = ".", features = ["test-support"] }
regex = "=1.13.1"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
