[package]
name = "harness"
version = "0.1.0"
description = "Durable task runtime: the Pi Durable scheduler and conversation runtime (submissions, generation, durable REPL cells, children, swarm state), the RLM task journal, the lane snapshot reducer and the effect gate"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
chord-delta = { path = "../chord-delta" }
compaction = { path = "../compaction" }
durable = { path = "../durable" }
indexmap = "=2.14.2"
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
model-scope = { path = "../model-scope" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { path = "../session-journal" }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
