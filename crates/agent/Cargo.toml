[package]
name = "ultron-agent-core"
version.workspace = true
description = "Agent loop of packages/agent: turns over ai streaming, tool execution, steering/follow-up queues, abort, and the AgentEvent stream"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "agent"

[dependencies]
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.1" }
jsonschema = { package = "ultron-jsonschema", path = "../jsonschema", version = "=1.0.1" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "rt"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
