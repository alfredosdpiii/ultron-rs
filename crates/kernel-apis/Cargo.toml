[package]
name = "kernel-apis"
version = "0.1.0"
description = "Host operations behind the thin Python kernel APIs: code skills and the skill catalog, memory, hints, images"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
base64 = "=0.23.1"
fancy-regex = "=0.19.2"
getrandom = "=0.4.3"
host = { path = "../host" }
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
resources = { path = "../resources" }
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { path = "../session-journal" }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt", "time"] }
yaml-rust2 = "=0.13.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
