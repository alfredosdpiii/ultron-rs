[package]
name = "optimize"
version = "0.1.0"
description = "ultron optimize: Ultron's own pipelines (judge seat, memory recall, autoreview) run as versioned variants against frozen test sets, offline by default; cost/quality points, failures, the Pareto frontier, and fitted judge thresholds as a proposal"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
blocking-http = { path = "../blocking-http" }
config = { path = "../config" }
delegation = { path = "../delegation" }
jsrt = { path = "../jsrt" }
judge = { path = "../judge" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
review = { path = "../review" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
