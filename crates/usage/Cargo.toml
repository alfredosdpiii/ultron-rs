[package]
name = "ultron-usage"
version.workspace = true
description = "Session usage: a session file's usage log (`ultron/usage-cli.ts` reader), its session report and the report's text, for `ultron usage`, `/usage` and `ultron mcp`'s `usage.report`"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "usage"

[dependencies]
config = { package = "ultron-config", path = "../config", version = "=1.0.1" }
durable = { package = "ultron-durable", path = "../durable", version = "=1.0.1" }
harness = { package = "ultron-harness", path = "../harness", version = "=1.0.1" }
indexmap = "=2.14.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
lanes = { package = "ultron-lanes", path = "../lanes", version = "=1.0.1" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.1" }
regex = "=1.13.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { package = "ultron-session-journal", path = "../session-journal", version = "=1.0.1" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
