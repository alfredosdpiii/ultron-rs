[package]
name = "usage"
version = "0.1.0"
description = "Session usage: a session file's usage log (`ultron/usage-cli.ts` reader), its session report and the report's text, for `ultron usage`, `/usage` and `ultron mcp`'s `usage.report`"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
config = { path = "../config" }
durable = { path = "../durable" }
harness = { path = "../harness" }
indexmap = "=2.14.2"
jsrt = { path = "../jsrt" }
lanes = { path = "../lanes" }
protocol = { path = "../protocol" }
regex = "=1.13.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { path = "../session-journal" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
