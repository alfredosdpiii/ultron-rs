[package]
name = "usage"
version = "0.1.0"
description = "Session usage: a session file's usage log (`ultron/usage-cli.ts` reader), its session report and the report's text, for `ultron usage`, `/usage` and `ultron mcp`'s `usage.report`"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
compaction = { path = "../compaction" }
delegation = { path = "../delegation" }
indexmap = "=2.14.2"
inference = { path = "../inference" }
jsrt = { path = "../jsrt" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-core = { path = "../session-core" }
session-journal = { path = "../session-journal" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
