[package]
name = "interactive"
version = "0.1.0"
description = "Interactive-mode conversation components (messages, tool/rlm cells, bash, summaries, footer, diffs) on the tui crate"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
config = { path = "../config" }
jsrt = { path = "../jsrt" }
rlm-views = { path = "../rlm-views" }
theme = { path = "../theme" }
tui = { path = "../tui" }
model-scope = { path = "../model-scope" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
fancy-regex = "=0.19.2"
crossterm = { version = "=0.29.0", default-features = false }
rustix = { version = "=1.1.5", features = ["event", "process", "std"] }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
unicode-segmentation = "=1.13.3"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
