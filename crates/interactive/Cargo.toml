[package]
name = "ultron-interactive"
version.workspace = true
description = "Interactive-mode conversation components (messages, tool/rlm cells, bash, summaries, footer, diffs) on the tui crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "interactive"

[dependencies]
ultron-assets = { path = "../../packages/coding-agent", version = "=1.0.1" }
config = { package = "ultron-config", path = "../config", version = "=1.0.1" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
rlm-views = { package = "ultron-rlm-views", path = "../rlm-views", version = "=1.0.1" }
theme = { package = "ultron-theme", path = "../theme", version = "=1.0.1" }
tui = { package = "ultron-tui", path = "../tui", version = "=1.0.1" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.1" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
fancy-regex = "=0.19.2"
crossterm = { version = "=0.29.0", default-features = false }
rustix = { version = "=1.1.5", features = ["event", "process", "std"] }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
unicode-segmentation = "=1.13.3"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
