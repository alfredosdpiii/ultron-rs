[package]
name = "memorantado"
version = "0.1.0"
description = "Ultron's memorantado memory client: memory.* over memorantado's REST API (scoped claims with keys, curation, file-snapshot evidence), the server and backend choice, over the blocking-http transport"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
blocking-http = { path = "../blocking-http" }
config = { path = "../config" }
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
