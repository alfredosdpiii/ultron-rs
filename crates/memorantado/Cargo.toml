[package]
name = "ultron-memorantado"
version.workspace = true
description = "Ultron's memorantado memory client: memory.* over memorantado's REST API (scoped claims with keys, curation, file-snapshot evidence), the server and backend choice, over the blocking-http transport"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "memorantado"

[dependencies]
blocking-http = { package = "ultron-blocking-http", path = "../blocking-http", version = "=1.0.2" }
config = { package = "ultron-config", path = "../config", version = "=1.0.2" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.2" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
