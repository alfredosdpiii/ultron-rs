[package]
name = "theme"
version = "0.1.0"
description = "Ultron themes: the theme document schema, the built-in dark and light themes, color resolution and conversion, ANSI palettes, text styles, the theme registry, and choosing a theme from the setting and the terminal's background"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
jsrt = { path = "../jsrt" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
