[package]
name = "ultron-jsonschema"
version.workspace = true
description = "TypeBox's JSON-schema checking as the TypeScript product runs it: the definition-registry meta-check, Check/Errors (keyword order, en_US messages, the eight-error cap), the registered string formats, Value.Convert, and tool-argument preparation and validation"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "jsonschema"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
fancy-regex = "=0.19.2"
icu_normalizer = "=2.3.0"
regex = "=1.13.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
