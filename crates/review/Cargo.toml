[package]
name = "review"
version = "0.1.0"
description = "Autoreview: the kernel review engine, its plan and the GitHub reviewer, daemon and service behind `ultron autoreview`"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
inference = { path = "../inference" }
kernel = { path = "../kernel" }
knowledge = { path = "../knowledge" }
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt", "time"] }
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"
