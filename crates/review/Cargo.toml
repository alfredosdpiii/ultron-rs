[package]
name = "ultron-review"
version.workspace = true
description = "Autoreview: the kernel review engine, its plan and the GitHub reviewer, daemon and service behind `ultron autoreview`"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "review"

[dependencies]
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.2" }
config = { package = "ultron-config", path = "../config", version = "=1.0.2" }
hindsight = { package = "ultron-hindsight", path = "../hindsight", version = "=1.0.2" }
inference = { package = "ultron-inference", path = "../inference", version = "=1.0.2" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.2" }
loki = { package = "ultron-loki", path = "../loki", version = "=1.0.2" }
knowledge = { package = "ultron-knowledge", path = "../knowledge", version = "=1.0.2" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.2" }
indexmap = { version = "=2.14.2", features = ["serde"] }
regex = "=1.13.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["rt", "time"] }
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"
