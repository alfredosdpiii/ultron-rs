[package]
name = "ultron-loki"
version.workspace = true
description = "Loki write-time guardrails: Rust port of the loki.py engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "loki"

[[bin]]
name = "loki"
path = "src/main.rs"

[dependencies]
ultron-assets = { path = "../../packages/coding-agent", version = "=1.0.0" }
fancy-regex = "=0.19.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.0" }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
sha2 = "=0.10.9"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.0" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt", "time"] }
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"
