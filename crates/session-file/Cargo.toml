[package]
name = "ultron-session-file"
version.workspace = true
description = "Ultron's Pi session JSONL format: entries, migrations, tree, model context, discovery"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "session_file"

[dependencies]
config = { package = "ultron-config", path = "../config", version = "=1.0.2" }
indexmap = "=2.14.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"
