[package]
name = "ultron-resources"
version.workspace = true
description = "System prompt and resource assembly: context files, skills, the runtime guide"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "resources"

[dependencies]
config = { package = "ultron-config", path = "../config", version = "=1.0.0" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.0" }
regex = "=1.13.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
yaml-rust2 = "=0.13.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
