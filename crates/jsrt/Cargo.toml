[package]
name = "jsrt"
version = "0.1.0"
description = "JavaScript semantics the TypeScript port is held to (JSON.stringify, String/Number/toFixed/Math.round, trim and \\s, UTF-16 length and slice, Date.parse/toISOString/now, localeCompare, truthiness) and the small runtime helpers every crate had a copy of (base64, sha256 hex, UUIDs, poison-free locks, payload field checks)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.10.9"

[lints]
workspace = true
