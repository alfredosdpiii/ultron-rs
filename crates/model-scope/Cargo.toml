[package]
name = "ultron-model-scope"
version.workspace = true
description = "Model patterns as the TypeScript resolver reads them (model-resolver.ts): minimatch globs, localeCompare, parseModelPattern and resolveModelScopeFromModels over any model record; shared by the provider layer and the TUI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "model_scope"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints]
workspace = true
