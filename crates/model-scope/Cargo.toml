[package]
name = "model-scope"
version = "0.1.0"
description = "Model patterns as the TypeScript resolver reads them (model-resolver.ts): minimatch globs, localeCompare, parseModelPattern and resolveModelScopeFromModels over any model record; shared by the provider layer and the TUI"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsrt = { path = "../jsrt" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints]
workspace = true
