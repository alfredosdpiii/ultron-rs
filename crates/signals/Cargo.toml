[package]
name = "signals"
version = "0.1.0"
description = "Process signal handling without unsafe: SIGINT, SIGTERM and SIGHUP caught and dispatched to the running mode's handler, never blocked (children inherit default handling); child processes run with a timeout, cancel and stop"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
nix = { version = "=0.31.3", features = ["signal"] }
rustix = { version = "=1.1.5", features = ["process", "std"] }
signal-hook = { version = "=0.4.6", default-features = false, features = ["iterator"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

# `install` is once per process: its own test binary.
[[test]]
name = "signals"
path = "tests/signals.rs"
