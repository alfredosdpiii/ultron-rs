[package]
name = "rlm-views"
version = "0.1.0"
description = "The live RLM views of the native TUI and `ultron watch` (run graph, docked panel, focus view, RLM pane, running work) and the one poll of the inspections they draw from"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
jsrt = { path = "../jsrt" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tui = { path = "../tui" }

[dev-dependencies]
fancy-regex = "=0.19.2"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
