[package]
name = "diagram"
version = "0.1.0"
description = "diagram.mermaid: Mermaid text rendered by node and the vendored Pele into an SVG in the Ultron theme's colours, with readable labels, and a PNG drawn by resvg"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
theme = { path = "../theme" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
