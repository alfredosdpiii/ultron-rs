[package]
name = "ultron-diagram"
version.workspace = true
description = "diagram.mermaid: Mermaid text rendered by node and the vendored Pele into an SVG in the Ultron theme's colours, with readable labels, and a PNG drawn by resvg"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "diagram"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.0" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.0" }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.0" }
theme = { package = "ultron-theme", path = "../theme", version = "=1.0.0" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
