[package]
name = "ultron-server"
version.workspace = true
description = "Ultron server: the Radius relay host"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "server"

[dependencies]
config = { package = "ultron-config", path = "../config", version = "=1.0.1" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.1" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
websocket = { package = "ultron-websocket", path = "../websocket", version = "=1.0.1" }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
