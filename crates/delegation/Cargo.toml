[package]
name = "delegation"
version = "0.1.0"
description = "Host side of rlm.spawn / collect / finish: the task journal, the kernel lane pool, subagent runs with host-side waits and completion events"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
harness = { path = "../harness" }
host = { path = "../host" }
jsonschema = { path = "../jsonschema" }
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
lanes = { path = "../lanes" }
model-scope = { path = "../model-scope" }
resources = { path = "../resources" }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["process", "std", "system"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signals = { path = "../signals" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }

[dev-dependencies]
config = { path = "../config" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
