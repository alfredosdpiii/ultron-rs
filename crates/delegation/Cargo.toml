[package]
name = "ultron-delegation"
version.workspace = true
description = "Host side of rlm.spawn / collect / finish: the task journal, the kernel lane pool, subagent runs with host-side waits and completion events"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "delegation"

[dependencies]
agent = { package = "ultron-agent-core", path = "../agent", version = "=1.0.2" }
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.2" }
harness = { package = "ultron-harness", path = "../harness", version = "=1.0.2" }
host = { package = "ultron-host", path = "../host", version = "=1.0.2" }
jsonschema = { package = "ultron-jsonschema", path = "../jsonschema", version = "=1.0.2" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.2" }
lanes = { package = "ultron-lanes", path = "../lanes", version = "=1.0.2" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.2" }
resources = { package = "ultron-resources", path = "../resources", version = "=1.0.2" }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["process", "std", "system"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.2" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }

[dev-dependencies]
config = { package = "ultron-config", path = "../config" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
