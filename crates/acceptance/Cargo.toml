[package]
name = "ultron-acceptance"
version.workspace = true
description = "Rust evidence for Ultron acceptance rows A01-A56: process-level tests through the Rust kernel, host, inference, harness and the ultron binary"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

# The `ultron` composition root (crates/cli/src/main.rs) built from this package, so its tests can run the real binary
# as a subprocess (`CARGO_BIN_EXE_ultron-acceptance`). Same source, same library code, same docs/runtime.py paths.
[[bin]]
name = "ultron-acceptance"
path = "../cli/src/main.rs"
test = false
doc = false

[dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
cli = { package = "ultron-agent", path = "../cli", version = "=1.0.0" }
daemon = { package = "ultron-daemon", path = "../daemon", version = "=1.0.0" }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.0" }

[dev-dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt" }
config = { package = "ultron-config", path = "../config" }
ai = { package = "ultron-ai", path = "../ai" }
delegation = { package = "ultron-delegation", path = "../delegation" }
host = { package = "ultron-host", path = "../host" }
interactive = { package = "ultron-interactive", path = "../interactive" }
inference = { package = "ultron-inference", path = "../inference" }
kernel = { package = "ultron-kernel", path = "../kernel" }
hindsight = { package = "ultron-hindsight", path = "../hindsight" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis" }
memorantado = { package = "ultron-memorantado", path = "../memorantado" }
lanes = { package = "ultron-lanes", path = "../lanes" }
protocol = { package = "ultron-protocol", path = "../protocol" }
session-core = { package = "ultron-session-core", path = "../session-core" }
services = { package = "ultron-services", path = "../services" }
session-file = { package = "ultron-session-file", path = "../session-file" }
session-journal = { package = "ultron-session-journal", path = "../session-journal" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["time"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "a23_durable_work"
path = "tests/a23_durable_work.rs"
