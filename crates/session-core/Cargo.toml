[package]
name = "session-core"
version = "0.1.0"
description = "One session's runtime, shared by every mode through the session worker: the rlm lane (model, provider, system prompt, the single rlm tool), the composition root of its host stack, the format-4 run journal, session naming, Pi read views, and the session actor"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
blocking-http = { path = "../blocking-http" }
compaction = { path = "../compaction" }
config = { path = "../config" }
delegation = { path = "../delegation" }
diagram = { path = "../diagram" }
durable = { path = "../durable" }
graph = { path = "../graph" }
harness = { path = "../harness" }
hindsight = { path = "../hindsight" }
host = { path = "../host" }
indexmap = "=2.14.2"
inference = { path = "../inference" }
jsonschema = { path = "../jsonschema" }
jsrt = { path = "../jsrt" }
judge = { path = "../judge" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
knowledge = { path = "../knowledge" }
lanes = { path = "../lanes" }
loki = { path = "../loki" }
mcp = { path = "../mcp" }
memorantado = { path = "../memorantado" }
model-scope = { path = "../model-scope" }
protocol = { path = "../protocol" }
regex = "=1.13.1"
resources = { path = "../resources" }
sandbox = { path = "../sandbox" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
services = { path = "../services" }
session-file = { path = "../session-file" }
session-journal = { path = "../session-journal" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }
usage = { path = "../usage" }

[lints]
workspace = true

[dev-dependencies]
base64 = "=0.23.1"
harness = { path = "../harness", features = ["test-support"] }
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "durable_chat_cell_kill"
path = "tests/durable_chat_cell_kill.rs"

[[test]]
name = "durable_scheduler_kill"
path = "tests/durable_scheduler_kill.rs"

[[test]]
name = "durable_swarm_python"
path = "tests/durable_swarm_python.rs"
