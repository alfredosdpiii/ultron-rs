[package]
name = "ultron-knowledge"
version.workspace = true
description = "The knowledge graph: what each repository's files are made of (constructs and symbols, by git blob), shared by every repository and read by the kernel"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "knowledge"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tree-sitter = "=0.25.10"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"

[lints]
workspace = true

[dev-dependencies]
kernel = { package = "ultron-kernel", path = "../kernel" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"
