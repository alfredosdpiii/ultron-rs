[package]
name = "mcp"
version = "0.1.0"
description = "MCP client (JSON-RPC 2.0 over stdio), tool-result content conversion, and mcp.json configuration"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ai = { path = "../ai" }
config = { path = "../config" }
jsrt = { path = "../jsrt" }
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["process", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"
base64 = "=0.23.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
jsonschema = { path = "../jsonschema" }
kernel = { path = "../kernel" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "proxy_env"
path = "tests/proxy_env.rs"
