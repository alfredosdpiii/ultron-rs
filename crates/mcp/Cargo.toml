[package]
name = "ultron-mcp"
version.workspace = true
description = "MCP client (JSON-RPC 2.0 over stdio), tool-result content conversion, and mcp.json configuration"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "mcp"

[dependencies]
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.0" }
config = { package = "ultron-config", path = "../config", version = "=1.0.0" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
rustix = { version = "=1.1.5", features = ["process", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
jsonschema = { package = "ultron-jsonschema", path = "../jsonschema" }
kernel = { package = "ultron-kernel", path = "../kernel" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "proxy_env"
path = "tests/proxy_env.rs"
