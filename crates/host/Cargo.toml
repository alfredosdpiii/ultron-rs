[package]
name = "ultron-host"
version.workspace = true
description = "Rust host operations behind the Python kernel API: bash, shell jobs, write checks"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "host"

[dependencies]
ultron-assets = { path = "../../packages/coding-agent", version = "=1.0.2" }
fancy-regex = "=0.19.2"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
loki = { package = "ultron-loki", path = "../loki", version = "=1.0.2" }
sandbox = { package = "ultron-sandbox", path = "../sandbox", version = "=1.0.2" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["process", "std"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "durable_jobs"
path = "tests/durable_jobs.rs"

[[test]]
name = "sandboxed_hand_over"
path = "tests/sandboxed_hand_over.rs"
