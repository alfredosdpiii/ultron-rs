[package]
name = "ultron-agent"
version.workspace = true
description = "The `ultron` binary: composition root (host stack, kernel), argument parsing, help, version, --list-models, session selection, print/JSON/RPC modes and `sandbox doctor`"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "cli"

[[bin]]
name = "ultron"
path = "src/main.rs"

[dependencies]
ultron-assets = { path = "../../packages/coding-agent", version = "=1.0.2" }
agent = { package = "ultron-agent-core", path = "../agent", version = "=1.0.2" }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.2" }
blocking-http = { package = "ultron-blocking-http", path = "../blocking-http", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
loki = { package = "loki-guardrails", version = "0.2.2" }
mimalloc = { version = "=0.1.52", default-features = false }
memorantado = { package = "ultron-memorantado", path = "../memorantado", version = "=1.0.2" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.2" }
resources = { package = "ultron-resources", path = "../resources", version = "=1.0.2" }
review = { package = "ultron-review", path = "../review", version = "=1.0.2" }
knowledge = { package = "ultron-knowledge", path = "../knowledge", version = "=1.0.2" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }
claude-root = { package = "ultron-claude-root", path = "../claude-root", version = "=1.0.2" }
client = { package = "ultron-client", path = "../client", version = "=1.0.2" }
config = { package = "ultron-config", path = "../config", version = "=1.0.2" }
daemon = { package = "ultron-daemon", path = "../daemon", version = "=1.0.2" }
delegation = { package = "ultron-delegation", path = "../delegation", version = "=1.0.2" }
host = { package = "ultron-host", path = "../host", version = "=1.0.2" }
herdr = { package = "ultron-herdr", path = "../herdr", version = "=1.0.2" }
hindsight = { package = "ultron-hindsight", path = "../hindsight", version = "=1.0.2" }
interactive = { package = "ultron-interactive", path = "../interactive", version = "=1.0.2" }
rustix = { version = "=1.1.5", features = ["event", "std", "termios"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
judge = { package = "ultron-judge", path = "../judge", version = "=1.0.2" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.2" }
optimize = { package = "ultron-optimize", path = "../optimize", version = "=1.0.2" }
sandbox = { package = "ultron-sandbox", path = "../sandbox", version = "=1.0.2" }
session-core = { package = "ultron-session-core", path = "../session-core", version = "=1.0.2" }
server = { package = "ultron-server", path = "../server", version = "=1.0.2" }
session-journal = { package = "ultron-session-journal", path = "../session-journal", version = "=1.0.2" }
inference = { package = "ultron-inference", path = "../inference", version = "=1.0.2" }
mcp = { package = "ultron-mcp", path = "../mcp", version = "=1.0.2" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.2" }
rlm-views = { package = "ultron-rlm-views", path = "../rlm-views", version = "=1.0.2" }
session-file = { package = "ultron-session-file", path = "../session-file", version = "=1.0.2" }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.2" }
telemetry = { package = "ultron-telemetry", path = "../telemetry", version = "=1.0.2" }
sha2 = "=0.10.9"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
theme = { package = "ultron-theme", path = "../theme", version = "=1.0.2" }
tui = { package = "ultron-tui", path = "../tui", version = "=1.0.2" }
url = "=2.5.8"
usage = { package = "ultron-usage", path = "../usage", version = "=1.0.2" }

[dev-dependencies]
indexmap = "=2.14.2"
base64 = "=0.23.1"
chord-delta = { package = "ultron-chord-delta", path = "../chord-delta" }
regex = "=1.13.1"
rustix = { version = "=1.1.5", features = ["net", "process", "std"] }
tempfile = "=3.27.0"
websocket = { package = "ultron-websocket", path = "../websocket" }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "daemon_durable_model"
path = "tests/daemon_durable_model.rs"

[[test]]
name = "daemon_processes"
path = "tests/daemon_processes.rs"

[[test]]
name = "self_update"
path = "tests/self_update.rs"
