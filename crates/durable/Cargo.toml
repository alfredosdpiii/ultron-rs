[package]
name = "ultron-durable"
version.workspace = true
description = "Pi Durable storage: records, the Storage contract, and the in-memory working copy"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "durable"

[dependencies]
chord-delta = { package = "ultron-chord-delta", path = "../chord-delta", version = "=1.0.0" }
indexmap = "=2.14.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]

[[test]]
name = "it"
path = "tests/it.rs"
