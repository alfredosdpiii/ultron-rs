[package]
name = "daemon"
version = "0.1.0"
description = "Ultron's local session daemon: coordinator, server generations, session worker supervision and the session worker process"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
base64 = "=0.23.1"
chord-delta = { path = "../chord-delta" }
config = { path = "../config" }
jsrt = { path = "../jsrt" }
harness = { path = "../harness" }
kernel-apis = { path = "../kernel-apis" }
mcp = { path = "../mcp" }
model-scope = { path = "../model-scope" }
protocol = { path = "../protocol" }
resources = { path = "../resources" }
review = { path = "../review" }
rustix = { version = "=1.1.5", features = ["fs", "process", "std"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
server = { path = "../server" }
session-core = { path = "../session-core" }
session-journal = { path = "../session-journal" }
signals = { path = "../signals" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

# Sets the process-wide settings defaults once: in `it` it leaked into every later settings test.
[[test]]
name = "owner"
path = "tests/owner.rs"

[[test]]
name = "persona_durable_default"
path = "tests/persona_durable_default.rs"

# Marks the process as the durable instance, once: in `it` every later worker-settings test saw durable.model.
[[test]]
name = "worker_settings_durable_model"
path = "tests/worker_settings_durable_model.rs"
