[package]
name = "ultron-services"
version.workspace = true
description = "Ultron's local services as kernel-API host operations: refinements (lessons) and their review and activation flow, skill-proposal validation, experiment history, release gates, and documents kept as session values"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "services"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.1" }
kernel-apis = { package = "ultron-kernel-apis", path = "../kernel-apis", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-journal = { package = "ultron-session-journal", path = "../session-journal", version = "=1.0.1" }

[dev-dependencies]
fancy-regex = "=0.19.2"
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
