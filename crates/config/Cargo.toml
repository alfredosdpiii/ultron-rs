[package]
name = "ultron-config"
version.workspace = true
description = "Ultron settings, auth.json, project trust and agent paths, file-compatible with the TypeScript product"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "config"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.2" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.2" }

[lints]
workspace = true

[dev-dependencies]
loki = { package = "ultron-loki", path = "../loki" }
review = { package = "ultron-review", path = "../review" }
tempfile = "=3.27.0"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "own_executable"
path = "tests/own_executable.rs"

# Sets the process-wide settings defaults once: in `it` it leaked into every later settings test.
[[test]]
name = "process_defaults"
path = "tests/process_defaults.rs"
