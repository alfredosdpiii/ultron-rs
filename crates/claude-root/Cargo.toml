[package]
name = "claude-root"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
config = { path = "../config" }
delegation = { path = "../delegation" }
durable = { path = "../durable" }
getrandom = "=0.4.3"
harness = { path = "../harness" }
herdr = { path = "../herdr" }
host = { path = "../host" }
indexmap = "=2.14.2"
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
kernel-apis = { path = "../kernel-apis" }
loki = { path = "../loki" }
regex = "=1.13.1"
resources = { path = "../resources" }
rustix = { version = "=1.1.5", features = ["process", "std"] }
sandbox = { path = "../sandbox" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
session-core = { path = "../session-core" }
session-file = { path = "../session-file" }
session-journal = { path = "../session-journal" }
signals = { path = "../signals" }
tokio = { version = "=1.53.2", features = ["rt", "time"] }
usage = { path = "../usage" }

[dev-dependencies]
hindsight = { path = "../hindsight" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "ported"
path = "tests/ported.rs"
