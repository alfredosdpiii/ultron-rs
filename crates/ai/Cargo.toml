[package]
name = "ultron-ai"
version.workspace = true
description = "Provider layer of packages/ai: message model, streaming events, every API implementation (Anthropic, OpenAI completions/responses/codex, Azure, Google, Vertex, Mistral, Bedrock, pi-messages, Claude Code CLI, Claude subscription), provider auth and every OAuth flow, images API, model catalog, user models.json, env API keys"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "ai"

[dependencies]
config = { package = "ultron-config", path = "../config", version = "=1.0.0" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.0" }
websocket = { package = "ultron-websocket", path = "../websocket", version = "=1.0.0" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.0" }
crc32fast = "=1.5.2"
indexmap = { version = "=2.14.2", features = ["serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
ruzstd = { version = "=0.8.3", default-features = false, features = ["std"] }
regex = "=1.13.1"
ring = "=0.17.14"
rustix = { version = "=1.1.5", features = ["fs", "process", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
signals = { package = "ultron-signals", path = "../signals", version = "=1.0.0" }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }

[[bin]]
# The inert MCP inventory server alone, for this crate's process tests; `ultron __internal inert-mcp` serves it in
# the product.
name = "ultron-inert-mcp"
path = "src/bin/ultron_inert_mcp.rs"
test = false

[dev-dependencies]
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.0" }
rcgen = "=0.14.7"
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "claude_code_lane"
path = "tests/claude_code_lane.rs"

[[test]]
name = "claude_subscription_admission"
path = "tests/claude_subscription_admission.rs"

[[test]]
name = "claude_subscription_catalog"
path = "tests/claude_subscription_catalog.rs"

[[test]]
name = "claude_subscription_client"
path = "tests/claude_subscription_client.rs"

[[test]]
name = "claude_subscription_fallback"
path = "tests/claude_subscription_fallback.rs"

[[test]]
name = "claude_subscription_relay"
path = "tests/claude_subscription_relay.rs"

[[test]]
name = "claude_subscription_process"
path = "tests/claude_subscription_process.rs"

[[test]]
name = "claude_subscription_usage"
path = "tests/claude_subscription_usage.rs"

[[test]]
name = "proxy_env"
path = "tests/proxy_env.rs"
