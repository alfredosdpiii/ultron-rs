[package]
name = "ultron-lsp"
version.workspace = true
description = "Language server diagnostics for every REPL file write: server detection, mise install, a stdio LSP client"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "lsp"

[dependencies]
host = { package = "ultron-host", path = "../host", version = "=1.0.2" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
loki = { package = "loki-guardrails", version = "=0.2.2" }
sandbox = { package = "ultron-sandbox", path = "../sandbox", version = "=1.0.2" }
rustix = { version = "=1.1.5", features = ["process", "std"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
url = "=2.5.8"

[dev-dependencies]
kernel = { package = "ultron-kernel", path = "../kernel" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
