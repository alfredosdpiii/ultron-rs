[package]
name = "ultron-compaction"
version.workspace = true
description = "Context compaction and branch summarization of packages/coding-agent/src/core/compaction: token estimation, cut points, summary requests"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "compaction"

[dependencies]
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.1" }
indexmap = "=2.14.2"
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
protocol = { package = "ultron-protocol", path = "../protocol", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
session-file = { package = "ultron-session-file", path = "../session-file", version = "=1.0.1" }
session-journal = { package = "ultron-session-journal", path = "../session-journal", version = "=1.0.1" }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
