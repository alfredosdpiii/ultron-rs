[package]
name = "lanes"
version = "0.1.0"
description = "A root's REPL lanes: named kernels running one cell at a time, detachable and cancellable cells, side lanes for a busy lane, and the kernel pool bounding live kernels"
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
jsrt = { path = "../jsrt" }
kernel = { path = "../kernel" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
