[package]
name = "ultron-lanes"
version.workspace = true
description = "A root's REPL lanes: named kernels running one cell at a time, detachable and cancellable cells, side lanes for a busy lane, and the kernel pool bounding live kernels"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "lanes"

[dependencies]
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.2" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.2" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
