[package]
name = "ultron-inference"
version.workspace = true
description = "Host side of rlm.infer (and rlm.load): budgets, contract validation with bounded re-asks, Incomplete results"
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
name = "inference"

[dependencies]
agent = { package = "ultron-agent-core", path = "../agent", version = "=1.0.1" }
ai = { package = "ultron-ai", path = "../ai", version = "=1.0.1" }
config = { package = "ultron-config", path = "../config", version = "=1.0.1" }
jsonschema = { package = "ultron-jsonschema", path = "../jsonschema", version = "=1.0.1" }
jsrt = { package = "ultron-jsrt", path = "../jsrt", version = "=1.0.1" }
kernel = { package = "ultron-kernel", path = "../kernel", version = "=1.0.1" }
model-scope = { package = "ultron-model-scope", path = "../model-scope", version = "=1.0.1" }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
host = { package = "ultron-host", path = "../host" }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
